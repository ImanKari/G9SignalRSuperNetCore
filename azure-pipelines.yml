# The default branch of this repository is main. This said master, which does not exist here,
# so no push has started a build since the rename - every release build had to be queued by
# hand, which is exactly the step someone forgets (fixed 2026-09-21).
trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'windows-latest'

parameters:
  - name: solutionPath
    type: string
    default: 'G9SignalRSuperNetCore/G9SignalRSuperNetCore.sln'
  - name: testProjects
    type: string
    default: 'G9SignalRSuperNetCore/G9SignalRSuperNetCore.Tests/G9SignalRSuperNetCore.Tests.csproj' # 'null' skips the test step
  - name: nugetPackages
    type: object
    default:
      - 'G9SignalRSuperNetCore/G9SignalRSuperNetCore.Client/bin/Release/*.nupkg'
      - 'G9SignalRSuperNetCore/G9SignalRSuperNetCore.Server/bin/Release/*.nupkg'
      # Opt-in MessagePack hub protocol (2.6+). Listed after the core packages so a problem publishing them cannot block those.
      - 'G9SignalRSuperNetCore/G9SignalRSuperNetCore.Client.MessagePack/bin/Release/*.nupkg'
      - 'G9SignalRSuperNetCore/G9SignalRSuperNetCore.Server.MessagePack/bin/Release/*.nupkg'
  - name: repositoryName
    type: string
    default: 'G9SignalRSuperNetCore' # Default to the same as the project name

variables:
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:
# Test API keys validation
- task: PowerShell@2
  displayName: "Validate Required API Keys"
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Starting API Keys validation..."
      $hasError = $false
      
      # Function to validate GitHub PAT
      function Test-GitHubPAT {
          param($token)
          try {
              $headers = @{
                  'Authorization' = "token $token"
                  'Accept' = 'application/vnd.github.v3+json'
              }
              $response = Invoke-RestMethod -Uri 'https://api.github.com/user' -Headers $headers -Method Get
              Write-Host "✓ GitHub PAT is valid and active"
              return $true
          }
          catch {
              $statusCode = $_.Exception.Response.StatusCode.value__
              switch ($statusCode) {
                  401 { Write-Host "##vso[task.logissue type=error]GitHub PAT is invalid or expired" }
                  403 { Write-Host "##vso[task.logissue type=error]GitHub PAT lacks required permissions" }
                  default { Write-Host "##vso[task.logissue type=error]GitHub PAT validation failed: $_" }
              }
              return $false
          }
      }
      
      # Function to validate Azure DevOps PAT
      function Test-AzureDevOpsPAT {
          param($token)
          try {
              $base64AuthInfo = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(":$token"))
              $headers = @{
                  'Authorization' = "Basic $base64AuthInfo"
                  'Accept' = 'application/json'
              }
              # Using Azure DevOps REST API to validate token
              $org = "g9tm" # Your organization name
              $response = Invoke-RestMethod -Uri "https://dev.azure.com/$org/_apis/projects?api-version=6.0" -Headers $headers -Method Get
              Write-Host "✓ Azure DevOps PAT is valid and active"
              return $true
          }
          catch {
              $statusCode = $_.Exception.Response.StatusCode.value__
              switch ($statusCode) {
                  401 { Write-Host "##vso[task.logissue type=error]Azure DevOps PAT is invalid or expired" }
                  403 { Write-Host "##vso[task.logissue type=error]Azure DevOps PAT lacks required permissions" }
                  default { Write-Host "##vso[task.logissue type=error]Azure DevOps PAT validation failed: $_" }
              }
              return $false
          }
      }
      
      # Function to validate NuGet API Key
      function Test-NuGetApiKey {
          param($apiKey)
          try {
              $headers = @{
                  'X-NuGet-ApiKey' = $apiKey
                  'Accept' = 'application/json'
              }
              # Verify API key using NuGet API
              $response = Invoke-RestMethod -Uri 'https://api.nuget.org/v3/index.json' -Headers $headers -Method Get
              
              # Additional validation by attempting to query package metadata
              $verifyUrl = 'https://api.nuget.org/v3-flatcontainer/newtonsoft.json/13.0.1/newtonsoft.json.nuspec'
              $response = Invoke-RestMethod -Uri $verifyUrl -Headers $headers -Method Get
              
              Write-Host "✓ NuGet API Key is valid and active"
              return $true
          }
          catch {
              $statusCode = $_.Exception.Response.StatusCode.value__
              switch ($statusCode) {
                  401 { Write-Host "##vso[task.logissue type=error]NuGet API Key is invalid or expired" }
                  403 { Write-Host "##vso[task.logissue type=error]NuGet API Key lacks required permissions" }
                  default { Write-Host "##vso[task.logissue type=error]NuGet API Key validation failed: $_" }
              }
              return $false
          }
      }
      
      Write-Host "`nValidating GitHub PAT..."
      if (-not (Test-GitHubPAT -token "$(Github.PAT)")) {
          $hasError = $true
      }
      
      Write-Host "`nValidating Azure DevOps PAT..."
      if (-not (Test-AzureDevOpsPAT -token "$(AzureDevOps.PAT)")) {
          $hasError = $true
      }
      
      Write-Host "`nValidating NuGet API Key..."
      if (-not (Test-NuGetApiKey -apiKey "$(NuGetApiKey)")) {
          $hasError = $true
      }
      
      if ($hasError) {
          Write-Host "##vso[task.complete result=Failed;]One or more API keys failed validation"
          throw "API key validation failed. Please check the logs above for specific errors."
      }
      else {
          Write-Host "`n✓ All API keys are valid and active"
      }

# Install NuGet tool
- task: NuGetToolInstaller@1

# Restore NuGet packages
- task: NuGetCommand@2
  inputs:
    restoreSolution: '${{ parameters.solutionPath }}'

# Build the solution
- task: VSBuild@1
  inputs:
    solution: '${{ parameters.solutionPath }}'
    msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=Package /p:ContinuousIntegrationBuild=true /p:PackageAsSingleFile=true /p:SkipInvalidConfigurations=true /p:PackageLocation="$(build.artifactStagingDirectory)"'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'

# Run the tests before anything is published. The switch is the template PARAMETER: a template expression is evaluated
# when the pipeline is compiled, so the runtime variable the previous version set here was never seen and the step never ran.
- ${{ if ne(parameters.testProjects, 'null') }}:
  - task: DotNetCoreCLI@2
    displayName: Run Tests
    inputs:
      command: test
      projects: '${{ parameters.testProjects }}'
      arguments: '--configuration $(buildConfiguration)'

# The TypeScript/Lynx workspace (js/: @g9tm/signalr-supernetcore-client + @g9tm/signalr-supernetcore-lynx) mirrors the
# .NET client under the parity rule (AGENTS.md, js/packages/client/PARITY.md) and carries the same version: it is
# verified, run against the real sample server, its Android code is checked, and it is packed BEFORE anything is
# published, so a release never leaves the sides out of step.
- task: NodeTool@0
  displayName: Node.js 22 (TypeScript/Lynx packages)
  inputs:
    versionSpec: '22.x'

- script: npm ci --no-audit --no-fund && npm run verify
  displayName: TypeScript/Lynx - versions, typecheck, tests, Lynx sandbox, build, Lynx runtime gate
  workingDirectory: js
  env:
    CI: 'true'

- script: npm run test:interop -w packages/lynx
  displayName: Lynx - interop with the real sample server (JSON + MessagePack, every transport path)
  workingDirectory: js
  env:
    CI: 'true'

# Kotlin 2.3 needs JDK 17+; the hosted image's Gradle runs the JVM suite and the compile check against Lynx 4.1.0.
- script: npm run test:android-jvm -w packages/lynx && npm run check:android-module -w packages/lynx
  displayName: Lynx - Android core on the JVM, module compile check (Autolink provider)
  workingDirectory: js
  env:
    JAVA_HOME: $(JAVA_HOME_17_X64)

- script: npm run pack:all
  displayName: TypeScript/Lynx - pack
  workingDirectory: js

- task: PublishPipelineArtifact@1
  displayName: Attach the npm tarballs
  inputs:
    targetPath: js/artifacts/npm
    artifact: npm

# Validate and publish NuGet packages
- ${{ each packagePath in parameters.nugetPackages }}:
  - task: PowerShell@2
    displayName: "Publish NuGet Package - ${{ packagePath }}"
    inputs:
      targetType: 'inline'
      script: |
        Write-Host "==============================================="
        Write-Host "Starting NuGet Package Publishing Process"
        Write-Host "==============================================="
        
        # Display current working directory and package path
        Write-Host "Current Directory: $(Get-Location)"
        $packagePath = "${{ packagePath }}"
        Write-Host "Looking for packages in: $packagePath"
        
        # Verify path exists
        if (-not (Test-Path (Split-Path $packagePath -Parent))) {
            Write-Host "##vso[task.logissue type=warning]Parent directory does not exist: $(Split-Path $packagePath -Parent)"
            Write-Host "Directory Structure:"
            Get-ChildItem -Path "$(Get-Location)" -Recurse -Directory | Select-Object FullName | Format-Table
            throw "Parent directory not found"
        }
        
        # Try to find packages
        try {
            $packages = Get-ChildItem -Path $packagePath -ErrorAction Stop
            Write-Host "Found $($packages.Count) package(s)"
        }
        catch {
            Write-Host "##vso[task.logissue type=error]Error searching for packages: $_"
            Write-Host "Contents of parent directory:"
            Get-ChildItem -Path (Split-Path $packagePath -Parent) -Force | Format-Table Name, LastWriteTime, Length
            throw "Failed to locate packages"
        }
        
        # If no packages found
        if ($packages.Count -eq 0) {
            Write-Host "##vso[task.logissue type=warning]No packages found matching pattern: $packagePath"
            Write-Host "Searching nearby directories for .nupkg files..."
            $nearbyPackages = Get-ChildItem -Path (Split-Path $packagePath -Parent) -Recurse -Filter "*.nupkg"
            if ($nearbyPackages) {
                Write-Host "Found these .nupkg files in nearby directories:"
                $nearbyPackages | ForEach-Object {
                    Write-Host " - $($_.FullName)"
                }
            }
            throw "No packages found to publish"
        }
        
        # Process each package
        foreach ($package in $packages) {
            Write-Host "`n-------------------------------------------"
            Write-Host "Processing package: $($package.Name)"
            Write-Host "Full path: $($package.FullName)"
            Write-Host "Last modified: $($package.LastWriteTime)"
            Write-Host "Size: $([math]::Round($package.Length / 1KB, 2)) KB"
            Write-Host "-------------------------------------------"
            
            # Verify package exists and is readable
            if (-not (Test-Path $package.FullName -PathType Leaf)) {
                Write-Host "##vso[task.logissue type=error]Package file no longer exists or is not accessible: $($package.FullName)"
                continue
            }
            
            # Verify package is a valid .nupkg file
            if (-not $package.Extension -eq ".nupkg") {
                Write-Host "##vso[task.logissue type=warning]File is not a .nupkg file: $($package.FullName)"
                continue
            }
            
            # Attempt to publish
            try {
                Write-Host "Attempting to publish package..."
                $output = & dotnet nuget push $package.FullName --api-key $(NuGetApiKey) --source https://api.nuget.org/v3/index.json --skip-duplicate 2>&1
                Write-Host "Push command output:"
                Write-Host $output
                
                if ($LASTEXITCODE -eq 0) {
                    Write-Host "Successfully published package: $($package.Name)"
                } else {
                    Write-Host "##vso[task.logissue type=error]Failed to publish package. Exit code: $LASTEXITCODE"
                    throw "Package push failed with exit code $LASTEXITCODE"
                }
            }
            catch {
                Write-Host "##vso[task.logissue type=error]Exception while publishing package: $_"
                throw "Failed to publish package: $_"
            }
        }
        
        Write-Host "`n==============================================="
        Write-Host "Package Publishing Process Complete"
        Write-Host "==============================================="

# Publish the npm packages (2.10+), after the NuGet pushes and before the tag, under the same rules: only on main, a
# version already on npm is skipped (re-running a release is harmless), and the step needs the secret variable NpmToken
# (an npm automation token of the g9tm organization). Without it the step says so and the tarballs stay attached above.
- task: PowerShell@2
  displayName: "Publish npm packages (@g9tm)"
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  env:
    NPM_TOKEN: $(NpmToken)
  inputs:
    targetType: 'inline'
    workingDirectory: js
    script: |
      # Not '$' + '(NpmToken)' written as one macro: Azure expands it inside this script as well, and the check
      # then compared the token with itself (build 514 published NuGet but skipped npm as 'not set').
      if ([string]::IsNullOrWhiteSpace($env:NPM_TOKEN) -or $env:NPM_TOKEN -eq ('$' + '(NpmToken)')) {
          Write-Host "##vso[task.logissue type=warning]NpmToken is not set: the npm packages were packed (artifact 'npm') but not published."
          exit 0
      }
      $npmrc = Join-Path $env:AGENT_TEMPDIRECTORY 'g9tm.npmrc'
      Set-Content -LiteralPath $npmrc -Value "//registry.npmjs.org/:_authToken=$($env:NPM_TOKEN)`nregistry=https://registry.npmjs.org/"
      try {
          foreach ($tarball in Get-ChildItem -Path 'artifacts/npm' -Filter '*.tgz') {
              # name@version from the tarball's package.json
              $manifest = (& tar -xOzf $tarball.FullName package/package.json) | ConvertFrom-Json
              $id = "$($manifest.name)@$($manifest.version)"
              $existing = & npm view $id version --userconfig $npmrc 2>$null
              if ($LASTEXITCODE -eq 0 -and $existing) {
                  Write-Host "$id is already on npm; skipping."
                  continue
              }
              & npm publish $tarball.FullName --access public --userconfig $npmrc
              if ($LASTEXITCODE -ne 0) { throw "npm publish failed for $id (exit code $LASTEXITCODE)." }
              Write-Host "Published $id"
          }
      }
      finally {
          Remove-Item -LiteralPath $npmrc -Force -ErrorAction SilentlyContinue
      }

# Tag the release as v<version> (2.8+). Only on main, and only when everything above succeeded - the tests and ALL the package
# pushes - so a tag always names a commit whose packages are on NuGet. It sits BEFORE the GitHub sync on purpose: the sync
# clones this repository afterwards, so the new tag is in that clone and travels to the mirror with the credentials the sync
# already uses. A tag that exists is never moved. Tagging never fails the release: the packages are already public by now.
# Needs "Create tag" = Allow for the build service identity on this repository (see README, "Build and test" > "Releases").
- task: PowerShell@2
  displayName: "Tag the release (v<version>)"
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  continueOnError: true
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
  inputs:
    targetType: 'inline'
    script: |
      try {
          Set-Location $env:BUILD_SOURCESDIRECTORY

          # The version is the one coordinate every package is built from...
          $propsPath = 'G9SignalRSuperNetCore/Directory.Build.props'
          [xml]$props = Get-Content -LiteralPath $propsPath -Raw
          $version = @($props.Project.PropertyGroup | ForEach-Object { $_.G9PackageVersion } | Where-Object { $_ })[0]
          if ([string]::IsNullOrWhiteSpace($version)) { throw "G9PackageVersion was not found in $propsPath." }
          $version = "$version".Trim()

          # ...and it must be the version the publish steps above just pushed: the same globs, this version's file in each.
          foreach ($pattern in '${{ join(';', parameters.nugetPackages) }}'.Split(';')) {
              $released = @(Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "*.$version.nupkg" })
              if ($released.Count -eq 0) { throw "No package of version $version matches $pattern, so $version is not what was released." }
          }

          $tag = "v$version"
          $auth = "AUTHORIZATION: bearer $env:SYSTEM_ACCESSTOKEN"

          # The agent's clone is shallow and has no tags, so ask the server.
          $existing = git -c http.extraheader="$auth" ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "git ls-remote failed with exit code $LASTEXITCODE." }
          if ($existing) {
              Write-Host "Tag $tag already exists ($existing). Leaving it where it is."
              exit 0
          }

          $name = $env:BUILD_REQUESTEDFOR
          if ([string]::IsNullOrWhiteSpace($name)) { $name = 'Azure Pipelines' }
          $email = $env:BUILD_REQUESTEDFOREMAIL
          if ([string]::IsNullOrWhiteSpace($email)) { $email = 'azure-pipelines@noreply.invalid' }

          # -f only replaces a stale LOCAL tag on a reused agent; the push below is not forced, so a remote tag cannot move.
          git -c user.name="$name" -c user.email="$email" tag -f -a $tag -m "Release $version" $env:BUILD_SOURCEVERSION
          if ($LASTEXITCODE -ne 0) { throw "git tag failed with exit code $LASTEXITCODE." }

          git -c http.extraheader="$auth" push origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "git push of $tag failed with exit code $LASTEXITCODE. Does the build service identity have 'Create tag' on this repository?" }

          Write-Host "Tagged $env:BUILD_SOURCEVERSION as $tag."
      }
      catch {
          Write-Host "##vso[task.logissue type=warning]The release is published but was not tagged: $_"
          Write-Host "##vso[task.complete result=SucceededWithIssues;]Release not tagged"
      }

      exit 0

- task: PowerShell@2
  displayName: "Sync Azure Devops repo with GitHub repo"
  inputs:
    targetType: 'inline'
    script: |
      # Write your PowerShell commands here.
      Write-Host ' - - - - - - - - - - - - - - - - - - - - - - - - -'
      Write-Host ' reflect Azure Devops repo changes to GitHub repo'
      Write-Host ' - - - - - - - - - - - - - - - - - - - - - - - - - '
      
      $repoName = "${{ parameters.repositoryName }}"
      $githubToken = "$(Github.PAT)"
      $headers = @{
          Authorization = "token $githubToken"
          Accept = "application/vnd.github.v3+json"
      }

      # Check if repository exists
      try {
          $repoCheckUrl = "https://api.github.com/repos/ImanKari/$repoName"
          $repoExists = Invoke-RestMethod -Uri $repoCheckUrl -Headers $headers -Method Get -ErrorAction SilentlyContinue
          Write-Host "Repository $repoName exists on GitHub"
      } catch {
          if ($_.Exception.Response.StatusCode.value__ -eq 404) {
              Write-Host "Repository $repoName does not exist. Creating it..."
              
              # Create repository
              $createRepoUrl = "https://api.github.com/user/repos"
              $body = @{
                  name = $repoName
                  private = $true  # Set to false if you want public repository
                  auto_init = $false
              } | ConvertTo-Json

              try {
                  $newRepo = Invoke-RestMethod -Uri $createRepoUrl -Headers $headers -Method Post -Body $body -ContentType "application/json"
                  Write-Host "Successfully created repository $repoName"
              } catch {
                  Write-Error "Failed to create repository: $_"
                  throw "Repository creation failed"
              }
          } else {
              Write-Error "Error checking repository: $_"
              throw "Repository check failed"
          }
      }

      # Proceed with sync process
      $stageDir = '$(Build.SourcesDirectory)' | Split-Path
      $githubDir = $stageDir +"\"+"gitHub"
      $destination = $githubDir +"\"+$repoName+".git"
      $alias = 'ImanKari:'+ $githubToken
      $sourceURL = 'https://$(AzureDevOps.PAT)@g9tm.visualstudio.com/'+$repoName+'/_git/'+ $repoName
      $destURL = 'https://' + $alias + '@github.com/ImanKari/'+$repoName+'.git'

      # Check if the parent directory exists and delete
      if((Test-Path -path $githubDir)) {
          Remove-Item -Path $githubDir -Recurse -force
      }
      if(!(Test-Path -path $githubDir)) {
          New-Item -ItemType directory -Path $githubDir
          Set-Location $githubDir
          git clone --mirror $sourceURL
      } else {
          Write-Host "The given folder path $githubDir already exists"
      }

      Set-Location $destination

      # This clone is `git clone --mirror`, so it is BARE and already holds every branch and tag exactly as Azure
      # has them. Pushing it with --mirror makes GitHub match Azure, which is the only thing 'mirror' can honestly
      # mean: a branch or tag deleted on Azure must not linger here, and a rewritten commit must be replaced.
      #
      # ⛔ It used to run `git push secondary --all`, which is NOT a force push, so the mirror could not survive a
      # rewritten commit. It did not survive one: 2.7.0 was pushed, mirrored, then amended on Azure 37 minutes later
      # (same tree, same author date, new committer date). GitHub kept the pre-amend object, every later push was
      # rejected as non-fast-forward, and the step failed on every release from 2026-09-17 until this was fixed on
      # 2026-09-21 - while the packages published perfectly, so the red build looked worse than it was.
      #
      # The two lines before it were dead: `git rm --cached giant_file` never matched anything, and
      # `git commit --amend -CHEAD` cannot run in a bare repository. Both printed a fatal error on every build.
      Write-Output '*****Git push mirror to GitHub****'
      git push --mirror $destURL
      $branchesExitCode = $LASTEXITCODE
      # No separate tag push: --mirror already carries refs/tags/* along with the branches.
      if ($branchesExitCode -ne 0) {
          Write-Host "##vso[task.logissue type=error]The GitHub mirror push failed (git exit code $branchesExitCode)."
      }
      $global:LASTEXITCODE = $branchesExitCode
      Write-Output '**Azure Devops repo synced with Github repo**'
      
      Set-Location $stageDir
      if((Test-Path -path $githubDir)) {
          Remove-Item -Path $githubDir -Recurse -force
      }